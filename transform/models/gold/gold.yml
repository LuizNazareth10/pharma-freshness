version: 2

models:
  - name: dim_farmaco
    description: >
      Dimensao conformada de farmaco.

      Grao: um nome de farmaco normalizado, como a fonte o reportou.

      A chave deriva SO do nome, que nunca muda. O RxCUI e enriquecimento e melhora a cada
      execucao; embuti-lo na chave fazia linhas de fato ja gravadas apontarem para identidades
      que a reconstrucao da dimensao apagava (6.066 orfas em 2026-07-29).

      A conformacao por principio ativo virou atributo: agrupe por `id_ingrediente` ou `rxcui`.
      Farmacos que o RxNorm nao conhece permanecem aqui, marcados por `mapeado_rxnorm = false`.
    columns:
      - name: id_farmaco
        description: >
          Chave substituta ESTAVEL, derivada apenas de `nome_normalizado`. Nao depende de
          nenhum dado que possa mudar entre execucoes.
        data_tests: [not_null, unique]
      - name: nome_normalizado
        description: Nome canonico reportado pela fonte; natural key desta dimensao.
        data_tests: [unique]
      - name: nome_farmaco
        description: Nome de exibicao; o nome RxNorm quando existe, senao o nome de origem.
        data_tests: [not_null]
      - name: rxcui
        description: Identificador RxNorm do ingrediente; nulo quando nao mapeado. Atributo.
      - name: id_ingrediente
        description: >
          Chave de ROLLUP por principio ativo: nomes diferentes que resolvem para o mesmo
          ingrediente compartilham este valor. Nao e chave estrangeira de nenhum fato --
          justamente porque pode mudar quando o RxNorm aprende algo novo.
        data_tests: [not_null]
      - name: mapeado_rxnorm
        description: Indica se o RxNorm resolveu algum RxCUI para este nome.
        data_tests: [not_null]
      - name: identidade_confiavel
        description: >
          Verdadeiro quando ha RxCUI E ele esta no nivel de ingrediente (IN/MIN/PIN).
          Comparacoes de volume entre farmacos deveriam filtrar por este campo.
        data_tests: [not_null]
      - name: tipo_correspondencia
        data_tests:
          - accepted_values:
              arguments:
                  values: ["exata", "aproximada", "nao_mapeado"]

  - name: dim_reacao
    description: >
      Dimensao de reacao adversa.
      Grao: um termo preferencial MedDRA distinto, normalizado.
      Sem codigo MedDRA: o dicionario e licenciado e o openFDA expoe apenas o texto do termo.
    columns:
      - name: id_reacao
        data_tests: [not_null, unique]
      - name: reacao_normalizada
        data_tests: [not_null, unique]
      - name: reacao
        description: Grafia mais frequente do termo, para exibicao.
        data_tests: [not_null]

  - name: dim_data
    description: >
      Dimensao de calendario gerada.
      Grao: um dia. Gerada e nao derivada dos fatos, para que dias sem evento existam como zero.
    columns:
      - name: id_data
        description: Dia no formato YYYYMMDD.
        data_tests: [not_null, unique]
      - name: data
        data_tests: [not_null, unique]
      - name: ano
        data_tests: [not_null]

  - name: dim_fonte
    description: >
      Dimensao de fonte do pipeline.
      Grao: um sistema de origem. Atributos vem do seed `fonte_referencia`.
    columns:
      - name: id_fonte
        data_tests: [not_null, unique]
      - name: fonte
        data_tests:
          - not_null
          - unique
          - accepted_values:
              arguments: {values: ["dailymed", "faers", "res"]}
      - name: cadencia_esperada
        description: Cadencia declarada da fonte; base do alerta de frescor da Fase 4.
        data_tests: [not_null]
      - name: sla_ingestao_horas
        description: >
          Limiar do SLO que NOS controlamos: horas toleradas sem uma ingestao bem-sucedida.
          Violar isso significa que o pipeline falhou ou parou.
        data_tests: [not_null]
      - name: sla_frescor_fonte_horas
        description: >
          Limiar do SLO da ORIGEM: horas toleradas entre o evento mais recente publicado pela
          fonte e o momento em que o capturamos. Violar isso significa que a fonte esta lenta,
          nao que o pipeline quebrou.
        data_tests: [not_null]

  - name: dim_bula
    description: >
      Dimensao de bula SPL do DailyMed.
      Grao: uma linha por `setid`, na versao corrente. Vira SCD tipo 2 quando a bronze passar
      a guardar o historico de versoes.
    columns:
      - name: id_bula
        data_tests: [not_null, unique]
      - name: setid
        data_tests: [not_null, unique]
      - name: id_farmaco
        description: Ligacao ao vocabulario RxNorm; nula quando o produto nao foi resolvido.
        data_tests:
          - relationships:
              arguments:
                  to: ref('dim_farmaco')
                  field: id_farmaco
      - name: published_date
        data_tests:
          - not_null
          - data_plausivel:
              arguments:
                  minima: "{{ var('data_minima_plausivel') }}"

  - name: fato_evento_adverso
    description: >
      Fato central de farmacovigilancia.

      GRAO: um par farmaco-reacao distinto dentro de um relato enviado a FDA.
      Chave logica: (safetyreportid, id_farmaco, id_reacao).

      ATENCAO AO CONTAR: o FAERS nao liga um medicamento especifico a uma reacao especifica.
      As linhas sao o produto cartesiano das duas listas dentro do relato, que e a unidade
      usada em analise de desproporcionalidade. Somar linhas NAO conta eventos clinicos --
      use `count(distinct safetyreportid)`.

      Nenhuma linha prova causalidade: um relato registra suspeita, nao nexo causal.
    data_tests:
      - chave_composta_unica:
          arguments:
              colunas: [safetyreportid, id_farmaco, id_reacao]
    columns:
      - name: id_evento
        description: Chave substituta deterministica do grao; chave do MERGE incremental.
        data_tests: [not_null, unique]
      - name: id_farmaco
        description: Chave estrangeira para `dim_farmaco`.
        data_tests:
          - not_null
          - relationships:
              arguments:
                  to: ref('dim_farmaco')
                  field: id_farmaco
      - name: id_reacao
        description: Chave estrangeira para `dim_reacao`.
        data_tests:
          - not_null
          - relationships:
              arguments:
                  to: ref('dim_reacao')
                  field: id_reacao
      - name: id_data_recebimento
        description: Chave estrangeira para `dim_data`, pela data de recebimento pela FDA.
        data_tests:
          - not_null
          - relationships:
              arguments:
                  to: ref('dim_data')
                  field: id_data
      - name: id_fonte
        description: Chave estrangeira para `dim_fonte`.
        data_tests:
          - not_null
          - relationships:
              arguments:
                  to: ref('dim_fonte')
                  field: id_fonte
      - name: id_bula
        description: Chave estrangeira opcional para `dim_bula`, via `spl_set_id` do openFDA.
        data_tests:
          - relationships:
              arguments:
                  to: ref('dim_bula')
                  field: id_bula
      - name: safetyreportid
        description: Dimensao degenerada -- identificador do relato de origem.
        data_tests: [not_null]
      - name: suspeito_primario
        description: Verdadeiro quando o notificador caracterizou o medicamento como suspeito.
        data_tests: [not_null]
      - name: event_time
        description: Relogio da fonte (recebimento pela FDA), em UTC.
        data_tests: [not_null]
      - name: ingest_time
        description: Relogio do pipeline (captura), em UTC.
        data_tests: [not_null]
      - name: latencia_ingestao_horas
        description: >
          Horas entre `event_time` (primeiro recebimento pela FDA) e `ingest_time`.
          Mede a IDADE DO CASO na captura, nao o atraso do pipeline: um relato antigo revisado
          hoje produz latencia de milhares de horas por caracteristica da fonte.
        data_tests: [not_null]
      - name: latencia_atualizacao_horas
        description: >
          Horas entre `receiptdate` (informacao mais recente da versao) e `ingest_time`.
          Esta e a latencia que o pipeline controla e a base honesta do staleness gap.
        data_tests: [not_null]
      - name: fonte
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ["faers"]}

  - name: fato_recall
    description: >
      Fato de acoes de recolhimento.
      GRAO: uma acao de recolhimento identificada por `recall_number`.
      `event_id` agrupa recalls relacionados e se repete entre linhas -- nao e chave.
    columns:
      - name: id_recall
        data_tests: [not_null, unique]
      - name: recall_number
        data_tests: [not_null, unique]
      - name: id_farmaco
        data_tests:
          - not_null
          - relationships:
              arguments:
                  to: ref('dim_farmaco')
                  field: id_farmaco
      - name: id_data_relatorio
        data_tests:
          - not_null
          - relationships:
              arguments:
                  to: ref('dim_data')
                  field: id_data
      - name: id_fonte
        data_tests:
          - not_null
          - relationships:
              arguments:
                  to: ref('dim_fonte')
                  field: id_fonte
      - name: classificacao_nivel
        description: "1 = Class I (mais grave), 2, 3."
        data_tests:
          - accepted_values:
              arguments:
                  values: [1, 2, 3]
                  quote: false
      - name: event_time
        data_tests: [not_null]
      - name: ingest_time
        data_tests: [not_null]
      - name: fonte
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ["res"]}

  - name: metricas_frescor
    description: >
      Serie temporal de medicoes de frescor, uma linha por (fonte, instante da medicao).
      Diferente das demais tabelas da gold, esta e um LOG: cada execucao acrescenta medicoes
      novas, porque "nada mudou desde ontem" tambem e informacao de frescor.

      Separa tres relogios de proposito: `atraso_da_fonte_horas` mede a origem (nao
      controlamos), `atraso_do_pipeline_horas` mede a nossa execucao (controlamos) e
      `idade_do_dado_horas` mede o que o consumidor sente. Somar tudo em um numero so esconde
      qual dos dois lados falhou.
    columns:
      - name: id_medicao
        description: Chave substituta de (fonte, medicao_em).
        data_tests: [not_null, unique]
      - name: medicao_em
        description: Instante da medicao; igual para todas as fontes de uma mesma execucao.
        data_tests: [not_null]
      - name: fonte
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ["dailymed", "faers", "res"]}
      - name: id_fonte
        description: Chave estrangeira para `dim_fonte`.
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_fonte'), field: id_fonte}
      - name: event_time_mais_recente
        description: Evento mais novo que possuimos para esta fonte.
        data_tests: [not_null]
      - name: ultimo_ingest_time
        description: Instante da captura mais recente desta fonte.
        data_tests: [not_null]
      - name: atraso_da_fonte_horas
        description: >
          Idade do dado mais novo NO MOMENTO da captura. Mede a origem: nenhuma mudanca no
          nosso codigo reduz este numero.
        data_tests: [not_null]
      - name: atraso_do_pipeline_horas
        description: >
          Horas entre a ultima captura e a medicao. Mede a nossa execucao: se cresce, o
          pipeline parou de rodar.
        data_tests: [not_null]
      - name: idade_do_dado_horas
        description: >
          Horas entre o evento mais recente e a medicao. E a soma dos dois atrasos e a unica
          metrica que descreve o que o consumidor final recebe.
        data_tests: [not_null]
      - name: situacao
        description: Classificacao derivada, priorizando a falha que e nossa.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                  values: ["ok", "pipeline_atrasado", "fonte_atrasada"]
      - name: violou_sla_pipeline
        data_tests: [not_null]
      - name: violou_sla_fonte
        data_tests: [not_null]

  - name: alertas_recentes
    description: >
      Camada de serving para consumo futuro pela LLM (Fase 6).

      Eventos adversos GRAVES com receivedate nos ultimos 7 dias, denormalizados com nome de
      farmaco, termo de reacao, fonte e datas citaveis.

      Grao: um par farmaco-reacao (`id_evento`) dentro de um relato grave recente.
      Toda linha tem `fonte` e `ingest_time` preenchidos (garantido por teste not_null).

      Contagem: somar linhas nao conta relatos clinicos — use count(distinct safetyreportid).
    columns:
      - name: id_evento
        description: Chave do grao; mesma identidade de `fato_evento_adverso`.
        data_tests: [not_null, unique]
      - name: safetyreportid
        description: Identificador do relato FAERS; usar distinct para contar casos.
        data_tests: [not_null]
      - name: farmaco
        description: Nome de exibicao do farmaco (RxNorm quando existe).
        data_tests: [not_null]
      - name: reacao
        description: Termo MedDRA de exibicao.
        data_tests: [not_null]
      - name: gravidade
        description: Sempre verdadeiro nesta tabela (filtro de serving).
        data_tests: [not_null]
      - name: data_recebimento_fda
        description: Data em que a FDA recebeu o relato; ancora da janela de 7 dias.
        data_tests: [not_null]
      - name: event_time
        data_tests: [not_null]
      - name: ingest_time
        description: Quando o pipeline capturou a linha; citavel junto com a fonte.
        data_tests: [not_null]
      - name: fonte
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ["faers"]}

  - name: bulas_atualizadas
    description: >
      Camada de serving para consumo futuro pela LLM (Fase 6).

      Bulas SPL cuja published_date cai nos ultimos 3 dias, com data de revisao, farmaco e
      URL citaveis.

      Grao: uma bula (`setid` / `id_bula`) na versao corrente conhecida.
      Toda linha tem `fonte` e `ingest_time` preenchidos (garantido por teste not_null).
    columns:
      - name: id_bula
        data_tests: [not_null, unique]
      - name: setid
        data_tests: [not_null, unique]
      - name: data_revisao
        description: published_date do DailyMed; ancora da janela de 3 dias.
        data_tests: [not_null]
      - name: farmaco
        description: Nome de exibicao; cai para produto_nome quando o RxNorm nao resolve.
        data_tests: [not_null]
      - name: event_time
        data_tests: [not_null]
      - name: ingest_time
        description: Quando o pipeline capturou a bula; citavel junto com a fonte.
        data_tests: [not_null]
      - name: fonte
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ["dailymed"]}
      - name: source_url
        description: URL da bula no DailyMed, para citacao.
        data_tests: [not_null]

seeds:
  - name: fonte_referencia
    description: >
      Atributos declarados de cada fonte do pipeline: mantenedor, cadencia esperada, URL e os
      limiares de SLO. Sao conhecimento do projeto, nao dado observado -- por isso vivem sob
      revisao de codigo, e mudar um limiar exige um commit.
    columns:
      - name: fonte
        data_tests: [not_null, unique]
      - name: sla_ingestao_horas
        data_tests: [not_null]
      - name: sla_frescor_fonte_horas
        data_tests: [not_null]
